<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Umacalc - Umamusume Stat Gain & Turn Calculator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- In-App Floating Mini-HUD (for mobile web / in-browser overlay testing) -->
  <div id="webFloatingHud" class="web-floating-hud">
    <div class="hud-top-bar">
      <span class="title">UMA HUD</span>
      <span id="hudTurnsBadge" class="turns-badge">50 Left</span>
      <button id="btnWebHudClose" class="btn btn-sm btn-danger" style="padding: 1px 5px; font-size: 0.6rem;">✕</button>
    </div>
    <div class="hud-buttons-row">
      <button id="webHudBtn_Speed" class="hud-btn btn-Speed" onclick="window.UmacalcApp.trainStat('Speed')">SPD<br>20</button>
      <button id="webHudBtn_Stamina" class="hud-btn btn-Stamina" onclick="window.UmacalcApp.trainStat('Stamina')">STA<br>0</button>
      <button id="webHudBtn_Power" class="hud-btn btn-Power" onclick="window.UmacalcApp.trainStat('Power')">POW<br>15</button>
      <button id="webHudBtn_Guts" class="hud-btn btn-Guts" onclick="window.UmacalcApp.trainStat('Guts')">GUT<br>0</button>
      <button id="webHudBtn_Wisdom" class="hud-btn btn-Wisdom" onclick="window.UmacalcApp.trainStat('Wisdom')">WIS<br>15</button>
    </div>
  </div>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-row">
      <div class="brand">
        <img src="images/horse_logo.png" class="brand-logo" alt="Umacalc Logo">
        <div class="brand-text">
          <h1><span class="uma">UMA</span><span class="calc">CALC</span></h1>
          <p>Umamusume Stat Gain &amp; Turn Planner</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnFloatingHud" class="btn btn-primary" title="Launch Floating Overlay HUD over Umamusume">
          <span>⚡ Floating HUD</span>
        </button>
        <button id="btnReset" class="btn btn-danger" title="Reset all trained turns">
          <span>Reset</span>
        </button>
      </div>
    </div>

    <!-- Scenario Selector -->
    <div class="scenario-row">
      <select id="scenarioSelect" class="scenario-select"></select>
    </div>
  </header>

  <!-- Progress Banner -->
  <section class="progress-banner">
    <div class="banner-top">
      <div class="hero-turns">
        <span class="label">TRAINABLE TURNS</span>
        <span id="trainableRemainingTxt" class="count">60</span>
      </div>

      <div class="banner-meta">
        <div class="progress-text">
          <span id="turnsProgressTxt"><strong>0 / 60</strong> trained (60 left)</span>
        </div>
        <div class="budget-adjuster">
          <span style="font-size: 0.72rem; color: #94a3b8;">Budget:</span>
          <button id="btnBudgetMinus" class="btn btn-sm">-</button>
          <strong id="trainableBudgetTxt" style="font-size: 0.85rem; color: #38bdf8; margin: 0 4px;">60</strong>
          <button id="btnBudgetPlus" class="btn btn-sm">+</button>
          <button id="btnQuickAdd5" class="btn btn-sm btn-primary" style="margin-left: 6px;">+5 Quick</button>
        </div>
      </div>
    </div>

    <!-- Full-Width Progress Bar -->
    <div class="banner-progress-bar">
      <div id="bannerProgressBar" class="fill"></div>
    </div>

    <!-- Strategic Next Suggestion -->
    <div id="suggestionBox" class="suggestion-box">
      Next Suggestion: Focus <strong>Speed</strong>
    </div>
  </section>

  <!-- The 5 Interactive Stat Cards -->
  <main>
    <div id="statCardsGrid" class="stat-cards-grid">
      <!-- Populated dynamically by app.js -->
    </div>

    <!-- Quick Action Bar -->
    <div class="action-bar">
      <button id="btnLogRest" class="btn" style="background: #1e3a8a; border-color: #3b82f6;">Log Rest (+1)</button>
      <button id="btnLogRace" class="btn" style="background: #78350f; border-color: #f59e0b;">Log Race (+1)</button>
      <button id="btnRecalculate" class="btn">Recalculate</button>
      <button id="btnUndo" class="btn" style="border-color: #64748b;">Undo</button>
    </div>

    <!-- Bottom Tabs Container -->
    <div class="tabs-container">
      <div class="tab-headers">
        <button class="tab-btn active" data-tab="tabPresets">Presets &amp; Support Cards</button>
        <button class="tab-btn" data-tab="tabScenario">Scenario Guide</button>
        <button class="tab-btn" data-tab="tabHistory">History Log</button>
      </div>

      <!-- TAB 1: PRESETS & SUPPORT CARDS -->
      <div id="tabPresets" class="tab-pane active">
        <!-- Preset Chips -->
        <div id="presetsChipsContainer"></div>

        <!-- Active Support Card Deck Blueprint with Training Bonus & Inspiration Bonus -->
        <div id="activeBlueprintContainer"></div>
      </div>

      <!-- TAB 2: SCENARIO GUIDE -->
      <div id="tabScenario" class="tab-pane">
        <div style="background: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 8px;">
          <h3 id="scenGuideName" style="color: #38bdf8; font-size: 1rem; margin-bottom: 2px;">URA Finals</h3>
          <p id="scenGuideJp" style="color: #94a3b8; font-style: italic; font-size: 0.75rem; margin-bottom: 6px;">新設！URAファイナルズ</p>
          <p style="font-size: 0.78rem; margin-bottom: 6px;">Stat Cap: <strong id="scenGuideCap" style="color: #f59e0b;">1200</strong></p>
          <div style="font-size: 0.78rem; line-height: 1.5; color: #cbd5e1;" id="scenGuideTips">
            Aim for high bond levels early (Junior year) to activate Rainbow Friendship Training by Classic summer camp.
          </div>
        </div>
      </div>

      <!-- TAB 3: HISTORY -->
      <div id="tabHistory" class="tab-pane">
        <div id="historyList" class="history-list"></div>
      </div>
    </div>
    <input type="file" id="umadumpFileInput" accept=".json" style="display:none;" onchange="window.UmacalcApp.handleUmadumpFileSelect(this)">
  </main>

  <script src="cards_catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
